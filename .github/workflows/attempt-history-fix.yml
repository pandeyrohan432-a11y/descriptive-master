name: Add unlimited attempts and history
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[attempt-history]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch attempt history
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/index.js')
          s=p.read_text(encoding='utf-8')

          old='const [paywallTest,setPaywallTest]=useState(3),[paywallStatus,setPaywallStatus]=useState(null),[accessGranted,setAccessGranted]=useState(false),[paywallBusy,setPaywallBusy]=useState(false);'
          new=old+'\n const [attemptHistory,setAttemptHistory]=useState([]),[historyTest,setHistoryTest]=useState(1),[currentAttemptId,setCurrentAttemptId]=useState(null);'
          if old not in s: raise SystemExit('state anchor not found')
          s=s.replace(old,new,1)

          old=' useEffect(()=>{if(view!=="dashboard"||!phone)return;fetch(`/api/access?phone=${encodeURIComponent(phone)}`).then(r=>r.ok?r.json():null).then(d=>{if(d?.accessGranted)setAccessGranted(true)}).catch(()=>{});},[view,phone]);'
          new=old+'\n useEffect(()=>{if(typeof window!=="undefined"&&phone){const all=[];for(let i=1;i<=10;i++){try{const x=JSON.parse(localStorage.getItem(`dm_attempts_${phone}_${i}`)||"[]");if(Array.isArray(x))all.push(...x)}catch(e){}}setAttemptHistory(all.sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt)));}},[view,phone]);'
          if old not in s: raise SystemExit('effect anchor not found')
          s=s.replace(old,new,1)

          old=' function start(n){if(n>=3&&!accessGranted){setPaywallTest(n);setPaywallStatus(null);setPaywallBusy(false);setView("paywall");return;}setTest(n);setAgree(false);setSection("essay");setEssayLocked(false);setTime(1800);setEssay("");setComp(["","","","",""]);setEvaluation(null);setEvalError("");setShowSolutions(false);setView("instructions")}\n'
          new=''' function readAttempts(n){if(typeof window==="undefined"||!phone)return [];try{const x=JSON.parse(localStorage.getItem(`dm_attempts_${phone}_${n}`)||"[]");return Array.isArray(x)?x:[]}catch(e){return []}}\n function writeAttempts(n,list){if(typeof window!=="undefined"&&phone)localStorage.setItem(`dm_attempts_${phone}_${n}`,JSON.stringify(list))}\n function start(n){if(n>=3&&!accessGranted){setPaywallTest(n);setPaywallStatus(null);setPaywallBusy(false);setView("paywall");return;}setTest(n);setAgree(false);setSection("essay");setEssayLocked(false);setTime(1800);setEssay("");setComp(["","","","",""]);setEvaluation(null);setEvalError("");setShowSolutions(false);setCurrentAttemptId(null);setView("instructions")}\n function reattempt(n){start(n)}\n function openHistory(n){setHistoryTest(n);setTest(n);setAttemptHistory(readAttempts(n).sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt)));setView("history")}\n'''
          if old not in s: raise SystemExit('start anchor not found')
          s=s.replace(old,new,1)

          old=''' async function submitForEvaluation(){if(evalBusy||view!=="exam")return;setEvalBusy(true);setEvalError("");setView("result");try{const r=await fetch("/api/ai-evaluate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({essayTopic:current,essay,passage,questions:qs,compAnswers:comp})});const j=await r.json();if(!r.ok)throw new Error(j.error||"AI evaluation failed");setEvaluation(j.evaluation)}catch(e){setEvalError(e.message||"Unable to connect to the AI evaluator.")}finally{setEvalBusy(false)}}\n'''
          new=''' async function submitForEvaluation(){if(evalBusy||view!=="exam")return;setEvalBusy(true);setEvalError("");const attemptId=`${Date.now()}-${Math.random().toString(36).slice(2,8)}`;const submittedAt=new Date().toISOString();setCurrentAttemptId(attemptId);const base={id:attemptId,testNo:test,submittedAt,essay,compAnswers:[...comp],evaluation:null,error:null};const existing=readAttempts(test);writeAttempts(test,[...existing,base]);setAttemptHistory(prev=>[base,...prev]);setView("result");try{const r=await fetch("/api/ai-evaluate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({essayTopic:current,essay,passage,questions:qs,compAnswers:comp})});const j=await r.json();if(!r.ok)throw new Error(j.error||"AI evaluation failed");const updated={...base,evaluation:j.evaluation};const list=readAttempts(test).map(x=>x.id===attemptId?updated:x);writeAttempts(test,list);setAttemptHistory(prev=>prev.map(x=>x.id===attemptId?updated:x));setEvaluation(j.evaluation)}catch(e){const msg=e.message||"Unable to connect to the AI evaluator.";const updated={...base,error:msg};writeAttempts(test,readAttempts(test).map(x=>x.id===attemptId?updated:x));setAttemptHistory(prev=>prev.map(x=>x.id===attemptId?updated:x));setEvalError(msg)}finally{setEvalBusy(false)}}\n'''
          if old not in s: raise SystemExit('submit anchor not found')
          s=s.replace(old,new,1)

          old=''' if(view==="dashboard")return <><style>{css}</style><div className="top"><div className="brand">DESCRIPTIVE MASTER</div><div>{name||"Student"}</div></div><div className="wrap"><h1>Descriptive Test</h1><p style={{color:"#697386"}}>IBPS PO • Essay + Comprehension • 25 Marks • 30 Minutes</p><div className="grid">{Array.from({length:10},(_,i)=>{const a=available(i)||(i>=2&&accessGranted);return <div className="card" key={i}><div style={{display:"flex",justifyContent:"space-between",gap:10}}><h3 style={{margin:0}}>Test {i+1}</h3>{a?<span className="live">AVAILABLE</span>:<span className="locked">LOCKED</span>}</div><div style={{marginTop:10}}>IBPS PO Descriptive</div><div className="meta"><span>❔ 2 Sections</span><span>✓ 25 Marks</span><span>◷ 30 Mins</span><span>◉ English</span></div>{a?<div className="release">{i>=2?"Access granted":"Available now"}</div>:<div className="release">Get full access to Tests 3–10</div>}<button className="btn primary" style={{width:"100%",marginTop:12}} disabled={false} onClick={()=>start(i+1)}>→ {a?"Start Test":"Get Access"}</button></div>})}</div></div></>;'''
          new=''' if(view==="dashboard")return <><style>{css}</style><div className="top"><div className="brand">DESCRIPTIVE MASTER</div><div>{name||"Student"}</div></div><div className="wrap"><h1>Descriptive Test</h1><p style={{color:"#697386"}}>IBPS PO • Essay + Comprehension • 25 Marks • 30 Minutes</p><div className="grid">{Array.from({length:10},(_,i)=>{const n=i+1,a=available(i)||(i>=2&&accessGranted),hist=readAttempts(n),latest=hist.length?hist[hist.length-1]:null,best=hist.reduce((m,x)=>Math.max(m,Number(x.evaluation?.totalScore)||0),0);return <div className="card" key={i}><div style={{display:"flex",justifyContent:"space-between",gap:10}}><h3 style={{margin:0}}>Test {n}</h3>{a?<span className="live">AVAILABLE</span>:<span className="locked">LOCKED</span>}</div><div style={{marginTop:10}}>IBPS PO Descriptive</div><div className="meta"><span>❔ 2 Sections</span><span>✓ 25 Marks</span><span>◷ 30 Mins</span><span>◉ English</span></div>{a?<div className="release">{hist.length?`Attempts: ${hist.length} • Best: ${best}/25`:i>=2?"Access granted":"Available now"}</div>:<div className="release">Get full access to Tests 3–10</div>}{a&&hist.length?<div style={{display:"flex",gap:8,marginTop:12}}><button className="btn outline" style={{flex:1}} onClick={()=>openHistory(n)}>Analysis</button><button className="btn primary" style={{flex:1}} onClick={()=>reattempt(n)}>Reattempt</button></div>:<button className="btn primary" style={{width:"100%",marginTop:12}} disabled={false} onClick={()=>start(n)}>→ {a?"Start Test":"Get Access"}</button>}</div>})}</div></div></>;'''
          if old not in s: raise SystemExit('dashboard anchor not found')
          s=s.replace(old,new,1)

          old=''' if(view==="result")return <><style>{css}</style><div className="top"><b>DESCRIPTIVE MASTER</b><b>Test {test}</b></div>{evalBusy?<div className="result center" style={{paddingTop:100}}><h1>Evaluating your answers with AI…</h1><p style={{color:"#667085"}}>Checking relevance, structure, grammar, depth and every comprehension answer.</p></div>:evalError?<div className="result"><div className="panel"><h2>Evaluation unavailable</h2><p>{evalError}</p><p style={{color:"#667085"}}>The evaluator uses Google Gemini on the server.</p><button className="btn outline" onClick={()=>setView("exam")}>Back to Test</button></div></div>:evaluation?<Evaluation evaluation={evaluation} essay={essay} comp={comp}/>:null}</>;'''
          new=''' if(view==="history")return <><style>{css}</style><div className="top"><b>DESCRIPTIVE MASTER</b><b>Test {historyTest}</b></div><div className="result"><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,marginBottom:18}}><div><h1 style={{margin:"0 0 6px"}}>Test {historyTest} — Attempt Analysis</h1><p style={{margin:0,color:"#667085"}}>Unlimited attempts • Each submitted attempt is saved separately.</p></div><button className="btn outline" onClick={()=>setView("dashboard")}>← Dashboard</button></div>{readAttempts(historyTest).sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt)).map((a,idx,arr)=><div className="panel" key={a.id} style={{marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}><div><h2 style={{margin:"0 0 5px"}}>Attempt {arr.length-idx}</h2><div style={{fontSize:13,color:"#667085"}}>{new Date(a.submittedAt).toLocaleString("en-IN")}</div></div><b style={{fontSize:24}}>{a.evaluation?`${a.evaluation.totalScore}/25`:a.error?"Evaluation failed":"Saved"}</b></div>{a.evaluation?<><div style={{display:"flex",gap:10,marginTop:14,flexWrap:"wrap"}}><span className="badge">Essay: {a.evaluation.essayScore}/15</span><span className="badge">Comprehension: {a.evaluation.comprehensionScore}/10</span></div><div style={{marginTop:15}}><b>Mistakes / marks lost</b><ul>{(a.evaluation.essay?.whatWasWrong||[]).map((x,j)=><li key={j} style={{margin:"7px 0"}}>{x}</li>)}{(a.evaluation.comprehension||[]).flatMap((x,j)=>(x.whatWasWrong?[`Q${j+1}: ${x.whatWasWrong}`]:[])).map((x,j)=><li key={`c${j}`} style={{margin:"7px 0"}}>{x}</li>)}</ul></div></>:<p style={{color:"#a52727"}}>{a.error||"This attempt was saved; evaluation is not available yet."}</p>}<details style={{marginTop:15}}><summary style={{cursor:"pointer",fontWeight:700}}>View saved answers</summary><div style={{marginTop:12}}><p className="label">Essay answer</p><div className="answer">{a.essay||"No answer attempted."}</div>{(a.compAnswers||[]).map((x,j)=><div key={j} style={{marginTop:12}}><p className="label">Comprehension Q{j+1}</p><div className="answer">{x||"No answer attempted."}</div></div>)}</div></details></div>)}<button className="btn primary" onClick={()=>reattempt(historyTest)}>Reattempt Test {historyTest}</button></div></>;\n if(view==="result")return <><style>{css}</style><div className="top"><b>DESCRIPTIVE MASTER</b><b>Test {test}</b></div>{evalBusy?<div className="result center" style={{paddingTop:100}}><h1>Evaluating your answers with AI…</h1><p style={{color:"#667085"}}>Checking relevance, structure, grammar, depth and every comprehension answer.</p></div>:evalError?<div className="result"><div className="panel"><h2>Evaluation unavailable</h2><p>{evalError}</p><p style={{color:"#667085"}}>Your submitted answers have already been saved as an attempt. You can retry evaluation later.</p><div style={{display:"flex",gap:10}}><button className="btn outline" onClick={()=>setView("dashboard")}>Dashboard</button><button className="btn primary" onClick={()=>reattempt(test)}>Reattempt</button></div></div></div>:evaluation?<><Evaluation evaluation={evaluation} essay={essay} comp={comp}/><div className="result" style={{paddingTop:0}}><button className="btn outline" onClick={()=>openHistory(test)}>View Attempt History</button><button className="btn primary" style={{marginLeft:10}} onClick={()=>reattempt(test)}>Reattempt Test</button></div></>:null}</>;'''
          if old not in s: raise SystemExit('result anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pages/index.js
          git diff --cached --quiet || git commit -m "[attempt-history] Add unlimited attempts and saved analysis"
          git push
