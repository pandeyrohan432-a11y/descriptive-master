name: Rejected access request retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[rejected-access-ui]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add rejected status and retry UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/index.js')
          s=p.read_text(encoding='utf-8')

          old='useEffect(()=>{if(view!=="dashboard"||!phone)return;fetch(`/api/access?phone=${encodeURIComponent(phone)}`).then(r=>r.ok?r.json():null).then(d=>{if(d?.accessGranted)setAccessGranted(true)}).catch(()=>{});},[view,phone]);'
          new='useEffect(()=>{if(view!=="dashboard"||!phone)return;fetch(`/api/access?phone=${encodeURIComponent(phone)}`).then(r=>r.ok?r.json():null).then(d=>{if(d?.accessGranted)setAccessGranted(true)}).catch(()=>{});},[view,phone]);\n useEffect(()=>{if(view!=="paywall"||!phone)return;fetch(`/api/access?phone=${encodeURIComponent(phone)}`).then(r=>r.ok?r.json():null).then(d=>{if(d?.accessGranted){setAccessGranted(true);setView("dashboard");}else if(d?.status)setPaywallStatus(d.status)}).catch(()=>{});},[view,phone]);'
          if old not in s:
              raise SystemExit('dashboard access status effect anchor not found')
          s=s.replace(old,new,1)

          old2='{paywallStatus==="pending"?<div style={{background:"#fff4d6",color:"#805b00",padding:12,borderRadius:8,fontSize:13}}>✓ Access request sent. Waiting for admin approval.</div>:paywallStatus?<div style={{background:"#fff0f0",color:"#a52727",padding:12,borderRadius:8,fontSize:13}}>{paywallStatus}</div>:<p style={{fontSize:13,color:"#697386"}}>Access to Tests 3–10 will be enabled after the administrator approves your request.</p>}'
          new2='{paywallStatus==="pending"?<div style={{background:"#fff4d6",color:"#805b00",padding:12,borderRadius:8,fontSize:13}}>✓ Access request sent. Waiting for admin approval.</div>:paywallStatus==="rejected"?<div style={{background:"#fff0f0",color:"#a52727",padding:12,borderRadius:8,fontSize:13}}>✕ Your previous access request was rejected. You can submit a new request after completing the payment.</div>:paywallStatus?<div style={{background:"#fff0f0",color:"#a52727",padding:12,borderRadius:8,fontSize:13}}>{paywallStatus}</div>:<p style={{fontSize:13,color:"#697386"}}>Access to Tests 3–10 will be enabled after the administrator approves your request.</p>}'
          if old2 not in s:
              raise SystemExit('paywall status UI anchor not found')
          s=s.replace(old2,new2,1)

          old3='{paywallBusy?"Sending…":"I\'ve Completed It — Request Access"}'
          new3='{paywallBusy?"Sending…":paywallStatus==="rejected"?"Send Request Again":"I\'ve Completed It — Request Access"}'
          if old3 not in s:
              raise SystemExit('paywall button anchor not found')
          s=s.replace(old3,new3,1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pages/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[rejected-access-ui] Show rejection and allow retry"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
