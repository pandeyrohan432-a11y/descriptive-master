name: Set current affairs comprehension
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[current-comprehension]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace comprehension passages and questions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/index.js')
          s=p.read_text(encoding='utf-8')
          d=Path('scripts/current-comprehension-data.txt').read_text(encoding='utf-8')
          passages=[x.strip() for x in re.findall(r'PASSAGE \d+\n(.*?)(?=\n\nPASSAGE \d+|\n\nQUESTION 1)',d,re.S)]
          questions=[x.strip().splitlines() for x in re.findall(r'QUESTION \d+\n(.*?)(?=\n\nQUESTION \d+|\Z)',d,re.S)]
          if len(passages)!=10 or len(questions)!=10 or any(len(q)!=5 for q in questions):
              raise SystemExit('Current comprehension data is incomplete')
          def js(s): return '`'+s.replace('\\','\\\\').replace('`','\\`')+'`'
          passage_js='const PASSAGES=[\n'+',\n'.join(js(x) for x in passages)+'\n];'
          question_js='const QUESTIONS=[\n'+',\n'.join('['+','.join('"'+q.replace('\\','\\\\').replace('"','\\"')+'"' for q in qs)+']' for qs in questions)+'\n];'
          s=re.sub(r'const PASSAGES=\[.*?\];',passage_js,s,count=1,flags=re.S)
          s=re.sub(r'const QUESTIONS=\[.*?\];',question_js,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pages/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[current-comprehension] Add distinct current affairs passages"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
