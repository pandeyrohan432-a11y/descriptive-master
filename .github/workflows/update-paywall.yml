name: Configure Test Paywall
on:
  push:
    paths:
      - '.github/workflows/update-paywall.yml'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply paywall
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pages/index.js')
          s=p.read_text()
          old='const available=i=>{const now=new Date();now.setHours(0,0,0,0);return now>=new Date(RELEASE_DATES[i]+"T00:00:00")};'
          new='const available=i=>i<2;'
          if old not in s: raise SystemExit('available function not found')
          s=s.replace(old,new,1)
          old2='function start(n){if(!available(n-1))return alert(`Test ${n} will be available on ${fmt(n-1)}.`);'
          new2='function start(n){if(n>2)return alert("Tests 3–10 are premium. Pay ₹49 one-time to unlock all 8 tests.");'
          if old2 not in s: raise SystemExit('start function not found')
          s=s.replace(old2,new2,1)
          old3='{a?<div className="release">Available now</div>:<div className="release">Available on <b>{fmt(i)}</b></div>}<button className="btn primary" disabled={!a} onClick={()=>start(i+1)}>→ {a?"Start Test":"Locked"}</button>'
          new3='{a?<div className="release"><span className="live">FREE</span> Available now</div>:<div className="release"><b>₹49</b> one-time • Unlock Tests 3–10</div>}<button className="btn primary" disabled={!a} onClick={()=>start(i+1)}>→ {a?"Start Test":"Pay ₹49 to Unlock"}</button>'
          if old3 not in s: raise SystemExit('dashboard card markup not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/index.js
          git commit -m 'Add ₹49 paywall for Tests 3-10' || exit 0
          git push
