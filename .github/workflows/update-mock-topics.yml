name: Update mock topics
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[mock-topics]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace mock essay and comprehension content
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('pages/index.js')
          s = p.read_text(encoding='utf-8')

          topics = '''const TOPICS=[
           "Artificial Intelligence: opportunities, risks and responsible adoption",
           "Digital Banking & Digital Payments: convenience, inclusion and consumer protection",
           "Cybersecurity & Online Fraud: building a safer digital ecosystem",
           "Banking & Financial Inclusion: bringing formal finance to every citizen",
           "Economy & Employment: growth, investment and quality job creation",
           "Climate Change & Sustainability: development without compromising resilience",
           "Renewable Energy: scaling clean power while ensuring reliable supply",
           "Women Empowerment & Workforce Participation: removing barriers to equal opportunity",
           "Data Privacy & Digital Rights: balancing innovation with individual control",
           "Gig Economy & Future of Work: flexibility, security and changing careers"
          ];'''

          passages = '''const PASSAGES=[
          `Artificial intelligence is moving from experimental projects into everyday business and public services. It can help organisations analyse large amounts of information, automate routine work and offer more personalised services. The benefits, however, depend on the quality of the data and the way systems are designed. Poorly tested models can reproduce errors or make decisions that are difficult for people to understand. AI also changes the skills that workers need, increasing the value of judgement, communication and domain knowledge alongside technical ability. Responsible adoption therefore requires clear accountability, human oversight and regular evaluation rather than blind trust in automated outputs. Policymakers and organisations also need to think about access so that the gains from AI do not remain limited to large firms or highly connected communities. The most useful approach is to treat AI as a tool that should strengthen human capability while keeping important decisions transparent and contestable.`,
          `Digital banking has made many financial services faster and easier to access. Customers can transfer money, pay bills, open accounts and monitor transactions without visiting a branch. These conveniences can be especially valuable for people who live far from traditional banking infrastructure. At the same time, digital access does not automatically mean financial security. Failed transactions, misleading interfaces, hidden charges and weak grievance handling can reduce trust. Older users and first-time digital customers may also need simple guidance to use services safely. Banks and payment providers therefore have to combine innovation with strong authentication, clear communication and responsive customer support. A healthy digital banking ecosystem should make transactions convenient without making customers responsible for risks they cannot reasonably understand or control.`,
          `Online fraud is becoming more sophisticated as criminals combine social engineering with rapidly changing digital tools. A victim may receive a convincing message, a fake customer-care call or a carefully designed website that appears legitimate. The strongest defence is not a single security product but a layered system of awareness, authentication, monitoring and rapid response. Users need to verify unexpected requests for money, passwords or sensitive information before acting. Financial institutions and platforms must detect unusual behaviour while protecting legitimate customers from unnecessary friction. When fraud occurs, quick reporting and coordinated investigation can improve the chances of limiting losses. Public awareness campaigns are therefore as important as technical controls. Cybersecurity ultimately depends on both secure systems and informed behaviour, because a weak link in either area can create an opportunity for criminals.`,
          `Financial inclusion is more than opening a bank account; it means being able to use useful financial services at a reasonable cost. A low-income household may need safe savings, affordable credit, insurance and reliable ways to receive payments. Formal financial channels can reduce dependence on informal lenders and make it easier to build a financial history. Yet barriers remain, including distance, documentation problems, low financial literacy and irregular income. Digital tools can reduce some of these barriers, but they should complement rather than replace human support. Products also need to match the real cash flows of households and small businesses instead of assuming stable monthly incomes. Consumer protection is essential because inclusion without transparency can create new forms of vulnerability. The broader goal is a financial system in which access, affordability, usefulness and trust develop together.`,
          `Economic growth becomes more durable when investment creates productive capacity and opportunities for people to earn stable incomes. Strong infrastructure can lower business costs, while private investment can expand factories, services and new enterprises. Recent signs of stronger investment in India show how public spending can eventually encourage private firms to increase their own capital expenditure. Yet headline growth alone does not guarantee that every worker benefits equally. Labour-intensive sectors, small businesses and skill development remain important for converting investment into broad employment gains. Businesses also need predictable rules and access to finance so that expansion can continue beyond short-term cycles. Policymakers therefore face the dual task of supporting productivity while improving the quality and reach of employment. A healthy economy is ultimately judged not only by its growth rate but also by whether growth creates resilient businesses and meaningful opportunities across regions and communities.`,
          `Climate change is increasingly affecting the way communities plan infrastructure, agriculture and public services. Extreme heat, intense rainfall and changing weather patterns can damage assets and disrupt daily life even when average conditions appear manageable. Adaptation therefore needs to become part of ordinary development decisions rather than a separate emergency programme. Buildings can be designed for heat, drainage can be improved and local ecosystems can be protected to reduce risks. Sustainability also requires attention to resource efficiency so that development does not create avoidable future costs. The burden of climate impacts is often unequal because vulnerable households have fewer resources to recover from shocks. Effective policy should therefore combine resilience with fairness and reliable local information. The objective is not to stop every natural hazard, but to reduce preventable damage and make communities better prepared for the changes already underway.`,
          `Renewable energy is expanding rapidly because countries want cleaner electricity as well as greater energy security. Solar and wind power can reduce dependence on imported fuels, but their output varies with weather and time of day. This makes storage, transmission and flexible demand increasingly important as renewable capacity grows. India is also considering stronger integration of battery storage with new renewable projects to improve reliability. Falling technology costs can support the transition, but land availability, grid connections and access to finance still influence the pace of deployment. A successful energy transition therefore needs more than installing generation capacity; it needs a modern grid that can move and store electricity efficiently. Communities also need to see economic benefits through jobs, local investment and reliable access to power. Renewable energy can become a foundation of long-term energy security when expansion is matched with planning for reliability and affordability.`,
          `Women's participation in the workforce is influenced by economic opportunity as well as social and workplace conditions. Many women face constraints related to childcare, commuting safety, unpaid care work or career breaks. Removing these barriers can expand the talent pool available to employers and increase household earning potential. Flexible work arrangements can help, but flexibility is useful only when it does not quietly create expectations of constant availability. Skills programmes and transparent promotion systems can also improve progression after women enter employment. Organisations benefit when leadership pathways are open to capable employees rather than shaped by assumptions about family responsibilities. Public policy can contribute through childcare, transport, education and enforcement of workplace protections. The larger objective is not simply to increase participation statistics but to make it possible for women to enter, remain and progress in work on fair terms.`,
          `The growth of digital services has made personal information an important economic and social resource. Businesses use data to personalise products, prevent fraud and improve services, while governments use it to deliver public programmes. These benefits create a need for rules that explain how information is collected, used, stored and shared. People should be able to understand important uses of their data rather than accepting complex terms without meaningful choice. At the same time, privacy rules must allow legitimate innovation and security work to continue. Good governance therefore depends on proportionality, accountability and safeguards against misuse. Strong security is also essential because even responsibly collected data can cause harm if it is exposed. Digital rights are strongest when individuals have practical control and organisations have clear responsibilities for handling information.`,
          `Platform-based work has created new ways for people to earn through short assignments, deliveries, driving and online services. The flexibility can help workers combine earning with study, family responsibilities or other occupations. However, irregular income and limited access to traditional benefits can make financial planning difficult. Ratings and automated allocation systems may also influence opportunities without being fully transparent to workers. A balanced approach should preserve useful flexibility while improving access to basic protection, timely payments and fair grievance mechanisms. Skills are becoming increasingly important because workers may move between several occupations during their careers. Employers and governments can support this transition through portable benefits, training and clearer information about working conditions. The future of work is therefore likely to require both adaptability from workers and responsible design of the systems through which work is organised.`
          ];'''

          questions = '''const QUESTIONS=[
           ["What benefits can AI provide to organisations and public services?","Why can poorly tested AI systems be harmful?","Which human skills remain important alongside technical ability?","Why is human oversight necessary in responsible AI adoption?","What approach to AI does the passage ultimately recommend?"],
           ["How has digital banking changed access to financial services?","Why is digital access not the same as financial security?","Which users may need additional guidance?","What responsibilities should banks and payment providers have?","What should a healthy digital banking ecosystem balance?"],
           ["How are online fraud methods becoming more sophisticated?","Why is a layered defence needed against digital fraud?","What should users verify before responding to unexpected requests?","How can financial institutions reduce fraud without creating excessive friction?","Why are public awareness and technical security both important?"],
           ["Why is financial inclusion more than simply opening a bank account?","Which services can help low-income households?","What barriers can prevent meaningful financial inclusion?","Why should digital tools not completely replace human support?","What broader goal should an inclusive financial system achieve?"],
           ["What can make economic growth more durable?","How can private investment support employment?","Why does headline GDP growth not guarantee equal benefits?","Which groups and policies are important for broad employment gains?","How should the success of an economy ultimately be judged?"],
           ["How can climate change disrupt communities and infrastructure?","Why should adaptation become part of normal development?","Which measures can reduce climate-related risks?","Why do climate impacts often affect vulnerable households more severely?","What is the main objective of climate resilience?"],
           ["Why is renewable energy becoming increasingly important?","What challenge is created by variable solar and wind output?","Why are storage and transmission important?","What other factors can affect renewable-energy expansion?","How can renewable energy support long-term energy security?"],
           ["Which factors can restrict women's workforce participation?","How can removing these barriers benefit employers and households?","What is a limitation of workplace flexibility?","How can skills and promotion systems improve women's careers?","What is the broader objective beyond increasing participation statistics?"],
           ["Why has personal information become economically and socially important?","What should people be able to understand about data use?","Why must privacy rules still allow legitimate innovation?","What role does security play in protecting digital rights?","What conditions make digital rights meaningful?"],
           ["Why do workers choose platform-based jobs?","What financial difficulties can gig workers face?","How can ratings and algorithms affect workers?","What should a balanced policy framework protect?","What will the future of work require from workers and institutions?"]
          ];'''

          s = re.sub(r'const TOPICS=\[.*?\];', topics, s, count=1, flags=re.S)
          s = re.sub(r'const PASSAGES=\[.*?\];', passages, s, count=1, flags=re.S)
          s = re.sub(r'const QUESTIONS=\[.*?\];', questions, s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pages/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[mock-topics] Refresh distinct essay and comprehension topics"
          git push
