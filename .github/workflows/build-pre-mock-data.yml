name: Restore PRE mock dataset

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 06e8eee9c6fa1255fe72c5fdbd3c1cd240e1bc29
          path: old-good
      - name: Restore known-good mock dataset
        run: |
          cp old-good/data/pre_mock_data.js data/pre_mock_data.js
          rm -rf old-good
          git add data/pre_mock_data.js
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore known-good SBI Clerk PRE mock dataset"
          git push
