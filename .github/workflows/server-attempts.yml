name: Sync attempts to server
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[server-attempts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch student and admin attempt tracking
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/index.js')
          s=p.read_text(encoding='utf-8')
          pattern=r' async function submitForEvaluation\(\)\{.*?finally\{setEvalBusy\(false\)\}\}'
          new=''' async function syncAttempt(a){try{await fetch("/api/attempts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:a.id,phone,name,testNo:a.testNo,submittedAt:a.submittedAt,essay:a.essay,compAnswers:a.compAnswers,evaluation:a.evaluation,error:a.error})})}catch(e){console.error("attempt sync failed",e)}}\n async function submitForEvaluation(){if(evalBusy||view!=="exam")return;setEvalBusy(true);setEvalError("");const attemptId=`${Date.now()}-${Math.random().toString(36).slice(2,8)}`;const submittedAt=new Date().toISOString();setCurrentAttemptId(attemptId);const base={id:attemptId,testNo:test,submittedAt,essay,compAnswers:[...comp],evaluation:null,error:null};const existing=readAttempts(test);writeAttempts(test,[...existing,base]);setAttemptHistory(prev=>[base,...prev]);syncAttempt(base);setView("result");try{const r=await fetch("/api/ai-evaluate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({essayTopic:current,essay,passage,questions:qs,compAnswers:comp})});const j=await r.json();if(!r.ok)throw new Error(j.error||"AI evaluation failed");const updated={...base,evaluation:j.evaluation};const list=readAttempts(test).map(x=>x.id===attemptId?updated:x);writeAttempts(test,list);setAttemptHistory(prev=>prev.map(x=>x.id===attemptId?updated:x));setEvaluation(j.evaluation);syncAttempt(updated)}catch(e){const msg=e.message||"Unable to connect to the AI evaluator.";const updated={...base,error:msg};writeAttempts(test,readAttempts(test).map(x=>x.id===attemptId?updated:x));setAttemptHistory(prev=>prev.map(x=>x.id===attemptId?updated:x));setEvalError(msg);syncAttempt(updated)}finally{setEvalBusy(false)}}'''
          s2,n=re.subn(pattern,new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('submit function not found')
          migrate='''\n useEffect(()=>{if(typeof window!=="undefined"&&phone){for(let i=1;i<=10;i++){try{const x=JSON.parse(localStorage.getItem(`dm_attempts_${phone}_${i}`)||"[]");if(Array.isArray(x))x.forEach(syncAttempt)}catch(e){}}}},[phone]);\n'''
          if 'x.forEach(syncAttempt)' not in s2:
              anchor=' useEffect(()=>{if(typeof window!=="undefined"&&phone){const all=[];for(let i=1;i<=10;i++){try{const x=JSON.parse(localStorage.getItem(`dm_attempts_${phone}_${i}`)||"[]");if(Array.isArray(x))all.push(...x)}catch(e){}}setAttemptHistory(all.sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt)));}},[view,phone]);'
              if anchor in s2: s2=s2.replace(anchor,anchor+migrate,1)
          p.write_text(s2,encoding='utf-8')

          p=Path('pages/admin.js')
          s=p.read_text(encoding='utf-8')
          login_re=r' const login=async\(\)=>\{.*?\};\n const refresh='
          login_new=''' const loadAttempts=async()=>{try{const r=await fetch('/api/attempts?admin=1');const d=await r.json();if(r.ok)setAttempts((d.attempts||[]).map(a=>({...a,testIndex:Number(a.test_no)-1,submittedAt:a.submitted_at,total:Number(a.evaluation?.totalScore)||0,score:Number(a.evaluation?.totalScore)||0})));else setNotice(d.error||'Could not load attempts');}catch{setNotice('Could not load attempts');}};\n const login=async()=>{setNotice('');try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:pass})});const d=await r.json();if(r.ok&&d.ok){setOk(true);setPass('');loadAttempts();loadRequests();}else setNotice(d.error||'Admin login failed');}catch{setNotice('Unable to contact server');}};\n const refresh='''
          s2,n=re.subn(login_re,login_new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('admin login anchor not found')
          s2=s2.replace("const refresh=()=>{setAttempts(readAttempts());loadRequests();setNotice('Refreshed');};","const refresh=()=>{loadAttempts();loadRequests();setNotice('Refreshed');};",1)
          s2=s2.replace('No attempt records are available in this browser yet. The current student build keeps its attempt/session data locally.','No student attempts have been submitted yet.',1)
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pages/index.js pages/admin.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[server-attempts] Sync attempts to server"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
